# PhysPony kinematic model, inference on video sequences.
#
#   python run.py --config-name test_physpony_horse \
#       dataset.test_data_dir=<sequences dir> test_result_dir=<output dir>

hydra:
  run:
    dir: .
  output_subdir: null


defaults:
  - base
  - dataset: sequence
  - model: ponymation


model:
  enable_render: true
  freeze_pretrained_branches: false
  cfg_render:
    render_default: false
    renderer_spp: 4
  cfg_predictor_instance:
    enable_motion_vae: true
    enable_deform: false
    cfg_articulation:
      extra_constraints: false

dataset:
  in_image_size: 256
  out_image_size: 256
  batch_size: 1
  num_frames: 10
  test_data_dir: ${oc.env:PHYSPONY_DATA,../data/magicpony}/horse_combined/val
  load_dino_feature: false
  dino_feature_dim: 16


run_train: false
run_test: true
checkpoint_dir: results/physpony/test
checkpoint_path: ${oc.env:PHYSPONY_KINEMATIC_CKPT,../checkpoints/physpony/kinematic.pth}
test_result_dir: ../outputs/kinematics
