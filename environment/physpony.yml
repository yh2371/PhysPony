# Trajectory (FastVGGT, UniDepthV2) and kinematic model.
name: physpony
channels:
  - pytorch3d
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=12.1
  - pytorch3d=0.7.8
  - pip:
      - numpy==2.2.6
      - xformers==0.0.28.post1
      - timm==1.0.30
      - opencv-python==4.11.0.86
      - scipy==1.15.3
      - scikit-image==0.25.2
      - scikit-learn==1.7.2
      - open3d==0.19.0
      - evo==1.38.0
      - pycolmap==3.10.0
      - pyceres==2.6
      - pytorch-minimize==0.1.0
      - huggingface_hub
      - safetensors
      - einops
      - trimesh
      - matplotlib
      - Pillow
      - imageio
      - h5py
      - tables
      - tqdm
      - protobuf
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - accelerate==1.1.1
      - configargparse
      - moviepy==1.0.3
      - pyopengl
      - glfw
      - xatlas
      - tensorboard
      - wandb
